        summary: ""
        highlights:
          - Technical lead in the real-time Voice and ML inference domain; set technical direction, led architecture reviews, defined long-term platform vision, and balanced iterative delivery against immediate business results.
          - Architected and operated a globally distributed real-time inference platform supporting 100k+ concurrent users, owning service architecture, scaling strategy, fault tolerance, deployment automation, and latency optimization across multiple AWS services.
          - Re-architected legacy real-time streaming services, establishing the core streaming infrastructure underpinning a large-scale omni-channel contact center platform with 99.9%+ availability.
