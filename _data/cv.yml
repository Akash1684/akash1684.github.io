          - Designed a GPU benchmarking framework across multiple instance types to evaluate performance/cost tradeoffs for TTS inference workloads; analysis directly informed infrastructure selection and reduced serving costs for the production stack.
          - Architected a distributed video transcoding pipeline — segment-based ingestion, per-contact demuxing, audio/video muxing and re-encoding into compressed MPEG-4, with KMS-encrypted delivery to customer S3 at scale.
          - Built a reproducible SageMaker-based ML training pipeline, replacing manual workflows and reducing model iteration time by 85% while improving experiment tracking and reproducibility.
          - Drove noise suppression and speech quality improvements across telephony and WebRTC deployments, improving average DNS-MOS score by 20%.
          - Hiring Bar Raiser passionate about mentoring and hiring; conducted 300+ interviews and influenced hiring decisions across multiple teams and roles.

